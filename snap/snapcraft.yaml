name: communitypod
version: 0.0.11
summary: Privacy preserving news sharing app using PODs.
description: |
  communitypod is a news sharing app, storing your news post files within your Solid
  Pod. Make news posts anywhere, anytime, on any device and review them
  later on. Great for drafting your news post while out and about, securely sharing it with your collaborators or community manager, and privately releasing it to your audience.

base: core22
grade: stable
confinement: strict

# 20251013 gjw Plugins that may be needed include the following, but are
# not required for every app:
#
#      - audio-playback
#      - pulseaudio
#      - screen-inhibit-control

apps:
  communitypod:
    command: communitypod
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - password-manager-service
      - opengl
      - wayland
      - x11

# 20251013 gjw The `flutter_secure_storage` package (and maybe
# `vault_storage`) is used by `solidpod/solidui` to save secrets
# locally, if the app provides this option to the user to do so. Thus
# `libsecret-1-dev` and `libjsoncpp-dev` are required to build the
# installer and `libsecret-1-0` and `libjsoncpp1` to run the
# application. See
#
# https://github.com/juliansteenbakker/flutter_secure_storage/blob/develop/README.md
# https://pub.dev/packages/vault_storage/versions/2.2.0#platform-setup
#
#    build-packages:
#      - libsecret-1-dev
#      - libjsoncpp-dev
#
#    stage-packages:
#      - libsecret-1-0
#      - libjsoncpp-dev
#
# 20251013 gjw If using the `audioplayers` package for flutter then
# the gstreamer packages are required for bulding the installer
# running the app.
#
#    build-packages:
#      - libgstreamer1.0-dev
#      - libgstreamer-plugins-base1.0-dev
#      - libgstreamer-plugins-good1.0-dev
#    stage-packages:
#      - libgstreamer1.0-0
#      - libgstreamer-plugins-base1.0-0
#      - libgstreamer-plugins-good1.0-0
#      - gstreamer1.0-plugins-good
#      - gstreamer1.0-plugins-base

parts:
  communitypod:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - binutils
      - clang
      - cmake
      - git
      - libblkid-dev
      - libgtk-3-dev
      - libjsoncpp-dev
      - liblzma-dev
      - libsecret-1-dev
      - libssl-dev
      - lld
      - llvm
      - ninja-build
    stage-packages:
      - libgtk-3-0
      - libjsoncpp-dev
      - libsecret-1-0
      - libssl3
